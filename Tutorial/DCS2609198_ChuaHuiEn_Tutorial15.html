<!DOCTYPE html>
<html>
<head>
<title>Form=Text Input</title>
<link rel="icon" href="1bcat2.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body topmargine=50>
<center>
<form>
<div style="background-color: powderblue;
color:#696969;
font-family:verdana;
font-size:160%
text-align:center;
width:60%;height:40%;">
<br>
Personal details:
<br><br>

<table style="width: 60%; table-layout: fixed;border-style:dashed; border-radius: 30px ;border-color:blue;">
<tr>
<td><br><br></td></tr>
<tr>
<br><br>
<td style="background-color:gold;">First Name:</td>
<td><input type=text style="border-radius: 10px ;border-color:lightblue;" name=fname></td>
</tr>
<tr>
<td style="background-color:gold;">Last Name: </td>
<td><input type=text=Iname style="border-radius: 10px ;border-color:lightblue;"></td>
</tr>
<tr>
<td style="background-color:gold;">Gender:</td>
<td><input type=radio name=gender value=Male> Male <input type=radio name=gender value=Female> Female </td>
</tr>
<tr>
<td style="background-color:gold;">Choose your favorite subjects:</td>
<td><input type=checkbox name=fav_sub value=DCS4103> DCS4103
<input type=checkbox name=fav_sub value=DCS4103> DCS4103
<input type=checkbox name=fav_sub value=MST1003> MST1003
<input type=checkbox name=fav_sub value=MST2003> MST2003 </td>
</tr>
<tr>
<td style="background-color:gold;">Address:</td>
<td><textarea rows=4 cols=30 name=address style="border-radius: 15px ;border-color:lightblue;"></textarea></td>
</tr>
<tr>
<td style="background-color:gold;">Date of birth:</td>
<td><input type=date style="border-radius: 10px ;" name=dab></td>
</tr>
<tr>
<td style="background-color:gold;">Login password:</td>
<td><input type=password style="border-radius: 10px ;border-color:lightblue;"name=loginpass></td>
</tr>
<tr>
<td style="background-color:gold;">Course:</td>
<td><select style="border-radius: 20px ;">
<option value="0">-List of Courses-</option>
<optgroup label="Diploma in Computer Science">
<option value="DCS_S1">Semester 1</option>
<option value="DCS_S2">Semester 2</option>
<option value="DCS_S3">Semester 3</option>
<option value="DCS_S4">Semester 4</option>
<option value="DCS_S5">Semester 5</option>
<option value="DCS_S6">Semester 6</option>
</optgroup>
<option value="DIB">Diploma in Bussiness</option>
<option value="DAS">Diploma in Airline Services</option>
</select>
</td></tr>
<tr>
<td><br><br></td></tr>


</table>
<br><br>
<input type=submit value=Submit>
<input type=reset value=Reset>
<br><br>
</div>
</form>
</center></body></html>
